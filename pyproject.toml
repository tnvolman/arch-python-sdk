[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arch-review"
version = "0.1.0"
description = "Typed Python client for the Arch theological review API."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Michael McClanahan" }]
keywords = ["arch", "review", "api", "client"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[project.urls]
Homepage = "https://arch.tnvolman.com"
Documentation = "https://arch.tnvolman.com/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/arch_review"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
